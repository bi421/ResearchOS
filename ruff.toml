line-length = 999
[lint]
select = ["E", "W", "F", "I"]
ignore = ["E501", "E402", "N801", "N802", "N803", "N806"]
exclude = [".git", ".lint_fix_backup*", "archive", "_backup_*", "docs/archive"]
[lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/**/*.py" = ["E402"]
"docs/**/*.md" = ["ALL"]
[format]
quote-style = "double"
indent-style = "space"
