line-length = 150
[lint]
select = ["E", "W", "F", "I"]
ignore = ["E501", "E402", "N801", "N802", "N803", "N806"]
exclude = [".git", ".lint_fix_backup*", "archive", "_backup_*"]
[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]
"scripts/**/*.py" = ["E402", "T201"]
"docs/**/*.md" = ["ALL"]
[format]
quote-style = "double"
indent-style = "space"
