name: Python Tests

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.14']

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"
        pip install pytest pytest-cov pytest-xdist ruff

    - name: Lint production Python code with ruff (deterministic E,F,W)
      run: |
        ruff check researchos --exclude '**/tests/**' --output-format=concise

    - name: Run pytest suite
      run: |
        # These six legacy/integration suites are intentionally excluded because
        # they require external broker/live-market infrastructure or specialized
        # runtime state that is not available in deterministic GitHub CI.
        # They remain runnable locally and are not treated as passing CI tests.
        pytest researchos/tests/ tests/unit/ researchos/data_engine/tests/ researchos/market_memory/tests/ researchos/experiments/phase51/tests/ --ignore=researchos/tests/test_ensemble.py --ignore=researchos/tests/test_sp500.py --ignore=researchos/tests/test_strategies_real.py --ignore=researchos/tests/test_tpsl.py --ignore=researchos/tests/test_tpsl_grid.py --ignore=researchos/tests/test_cpp_backtest_regression.py -v --tb=short --junitxml=test-results.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml

    - name: Generate coverage report
      if: matrix.python-version == '3.11'
      run: |
        # Keep the coverage population identical to the CI test population so
        # the six infrastructure-dependent suites cannot silently disappear
        # from coverage accounting without this explicit exclusion.
        pytest researchos/tests/ tests/unit/ researchos/data_engine/tests/ researchos/market_memory/tests/ researchos/experiments/phase51/tests/ --ignore=researchos/tests/test_ensemble.py --ignore=researchos/tests/test_sp500.py --ignore=researchos/tests/test_strategies_real.py --ignore=researchos/tests/test_tpsl.py --ignore=researchos/tests/test_tpsl_grid.py --ignore=researchos/tests/test_cpp_backtest_regression.py --cov=researchos --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
        verbose: true

  test-status:
    runs-on: ubuntu-latest
    if: failure()
    needs: test
    steps:
    - name: Report test failure
      run: |
        echo "Python test suite FAILED"
        echo "All code changes require passing tests before merge."
        exit 1
