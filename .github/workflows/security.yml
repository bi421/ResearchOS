name: Security Scan

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'audit/**' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_EXITCODE: 2
      - name: Report findings
        if: always()
        run: echo "[SCAN] Gitleaks scan completed"

  secret-scan-custom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Search for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          echo "[SCAN] Scanning for hardcoded secrets..."
          if grep -rE "BINANCE_API_KEY\s*=\s*['\"][^'\"]+|BINANCE_API_SECRET\s*=\s*['\"][^'\"]+|FRED_API_KEY\s*=\s*['\"][A-Za-z0-9]{20,}['\"]" \
            --exclude-dir=.git --exclude-dir=.github --exclude="*.lock" . | grep -vE "os\.getenv|os\.environ"; then
            echo "[FAIL] Found potential hardcoded API credentials!"
            exit 1
          fi
          if grep -rE "aws_access_key_id\s*=\s*['\"][^'\"]+|aws_secret_access_key\s*=\s*['\"][^'\"]+" \
            --exclude-dir=.git --exclude-dir=.github --exclude="*.lock" . | grep -vE "os\.getenv|os\.environ"; then
            echo "[FAIL] Found potential AWS credentials!"
            exit 1
          fi
          echo "[OK] No hardcoded secret patterns detected"
      - name: Check for secrets in environment files
        run: |
          if [ -f .env ] || [ -f .env.local ]; then
            echo "[FAIL] Environment files found in repo"
            exit 1
          fi
          echo "[OK] No environment files in repository"

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependencies
        run: pip-audit --desc --strict
      - name: Check pyproject.toml for risky dependencies
        run: |
          if grep -Eq "ccxt|binance|trading-engine" pyproject.toml; then
            echo "[FAIL] External trading libraries detected in main dependencies"
            exit 1
          fi
          echo "[OK] Dependency policy passed"
