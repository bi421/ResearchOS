name: Temporary C++ Risk Test Remediation

on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened]

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'audit/remediation-p0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update expectations to enforce risk boundary
        shell: python
        run: |
          from pathlib import Path
          p = Path('cpp_quant_engine/tests/test_strategy_kernel.cpp')
          s = p.read_text()
          replacements = {
              '''  EXPECT_DOUBLE_EQ(r.trades[0].quantity, 7.0);\n  EXPECT_DOUBLE_EQ(r.trades[0].net_pnl, 14.0);''': '''  EXPECT_DOUBLE_EQ(r.trades[0].quantity, 2.0);\n  EXPECT_DOUBLE_EQ(r.trades[0].net_pnl, 4.0);''',
              '''  ASSERT_EQ(r.trades.size(), 1u);\n  EXPECT_DOUBLE_EQ(r.trades[0].quantity, 4.0);''': '''  EXPECT_EQ(r.trades.size(), 0u);\n  EXPECT_EQ(r.signals_opened, 0u);\n  EXPECT_EQ(r.signals_ignored, 1u);''',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match, got {s.count(old)} for {old!r}')
              s = s.replace(old, new)
          p.write_text(s)
      - name: Commit remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cpp_quant_engine/tests/test_strategy_kernel.cpp
          git diff --cached --check
          git commit -m 'test(risk): align C++ sizing expectations with enforced boundary'
          git push
