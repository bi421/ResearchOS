name: Coverage Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest pytest-cov coverage

    - name: Run tests with coverage
      run: |
        pytest researchos/tests/ tests/unit/ researchos/data_engine/tests/ researchos/market_memory/tests/ researchos/experiments/phase51/tests/ researchos/experiments/phase52/tests/ \
          --ignore=researchos/tests/test_ensemble.py \
          --ignore=researchos/tests/test_sp500.py \
          --ignore=researchos/tests/test_strategies_real.py \
          --ignore=researchos/tests/test_tpsl.py \
          --ignore=researchos/tests/test_tpsl_grid.py \
          --ignore=researchos/tests/test_cpp_backtest_regression.py \
          --cov=researchos \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=50

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        verbose: true

    - name: Archive coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/

  coverage-check-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: coverage
    steps:
    - name: Report coverage failure
      run: |
        echo "[FAIL] Coverage check FAILED"
        echo "Code coverage must be >=50% for the coverage job"
        exit 1
