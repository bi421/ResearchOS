name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'examples/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest pytest-cov
      - name: Test
        run: pytest researchos/tests/ -v --cov=researchos --cov-report=xml --cov-report=term

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system deps
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 ccache ninja-build
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install nanobind scikit-build-core cmake
      - name: Cache build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
            cpp_quant_engine/build
          key: quant-${{ runner.os }}-${{ hashFiles('cpp_quant_engine/CMakeLists.txt', 'cpp_quant_engine/**/*.cpp', 'cpp_quant_engine/**/*.h', 'pyproject.toml') }}
          restore-keys: quant-${{ runner.os }}-
      - name: Configure C++ Quant Engine
        run: |
          cmake -S cpp_quant_engine -B cpp_quant_engine/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build C++ Quant Engine
        run: cmake --build cpp_quant_engine/build -j
      - name: Test C++ Quant Engine
        run: ctest --test-dir cpp_quant_engine/build -V
      - name: Test Python Quant Integration
        run: pytest researchos/tests/ -k quant -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: python-tests
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest pytest-cov
      - name: Test coverage
        run: pytest researchos/tests/ --cov=researchos --cov-report=xml --cov-report=term
