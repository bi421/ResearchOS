name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'examples/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -e . || pip install pytest
          pip install pytest pytest-cov
      - name: Test
        run: pytest researchos/tests/ -v --cov=researchos --cov-report=xml --cov-report=term

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
            build
          key: quant-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.h', '**/pyproject.toml') }}
          restore-keys: quant-${{ runner.os }}-
      - name: Build
        run: |
          pip install nanobind scikit-build-core cmake
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache || echo "No CMake, skipping"
          cmake --build build -j || echo "No C++ build"
      - name: Test Quant
        run: |
          ctest --test-dir build -V || echo "No ctest"
          pytest researchos/tests/ -k quant -v || echo "No quant tests"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: python-tests
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e .[dev] || pip install -e .; pip install pytest pytest-cov
      - run: pytest researchos/tests/ --cov=researchos --cov-report=xml --cov-report=term
