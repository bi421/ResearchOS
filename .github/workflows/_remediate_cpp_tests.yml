name: Temporary C++ risk test remediation

on:
  workflow_dispatch:

jobs:
  remediate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remediation-p0
          fetch-depth: 0
      - name: Update risk-boundary tests
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("cpp_quant_engine/tests/test_strategy_kernel.cpp")
          s = p.read_text()

          replacements = {
          "SignalQuantityOverridesSizing": r'''TEST(StrategyKernel, SignalQuantityDoesNotOverrideFixedLotSizing) {
            auto cfg = zero_cost_cfg();
            cfg.trade.sizing = PositionSizing::FixedLot;
            cfg.trade.fixed_lot = 2.0;
            cfg.trade.take_profit = 2.0;
            std::vector<OHLCV> bars = {
                mk(100, 100, 100, 100, 0),
                mk(100, 105, 99.5, 104, 1),
            };
            auto r = run_kernel(cfg, bars, {open_sig_qty(0, 7.0)});
            ASSERT_EQ(r.trades.size(), 1u);
            EXPECT_DOUBLE_EQ(r.trades[0].quantity, 2.0);
            EXPECT_DOUBLE_EQ(r.trades[0].net_pnl, 4.0);
          }''',
          "RiskSizingWithoutStopUsesDefaultQuantity": r'''TEST(StrategyKernel, RiskSizingWithoutStopRejectsEntry) {
            auto cfg = zero_cost_cfg();
            cfg.trade.sizing = PositionSizing::RiskPercent;
            cfg.trade.default_quantity = 4.0;
            cfg.trade.stop_loss = 0.0;
            std::vector<OHLCV> bars = {
                mk(100, 100, 100, 100, 0),
                mk(100, 100, 100, 100, 1),
            };
            auto r = run_kernel(cfg, bars, {open_sig(0)});
            EXPECT_EQ(r.trades.size(), 0u);
            EXPECT_EQ(r.signals_opened, 0u);
            EXPECT_EQ(r.signals_ignored, 1u);
          }''',
          "DailyLossLimitCircuitBreakerClosesPositions": r'''TEST(StrategyKernel, DailyLossLimitCircuitBreakerClosesPositions) {
            auto cfg = zero_cost_cfg();
            cfg.trade.sizing = PositionSizing::RiskPercent;
            cfg.trade.risk_percent = 2.0;
            cfg.trade.stop_loss = 100.0;
            cfg.risk.daily_loss_limit_pct = 0.05;
            std::vector<OHLCV> bars = {
                mk(100, 100, 100, 100, 0),
                mk(100, 100, 96, 96, 1),
            };
            auto r = run_kernel(cfg, bars, {open_sig(0)});
            ASSERT_EQ(r.trades.size(), 1u);
            EXPECT_EQ(r.trades[0].exit_reason, ExitReason::DailyLossLimit);
            EXPECT_DOUBLE_EQ(r.trades[0].exit_price, 96.0);
            EXPECT_DOUBLE_EQ(r.trades[0].quantity, 20.0);
            EXPECT_DOUBLE_EQ(r.trades[0].net_pnl, -80.0);
          }''',
          "EquityNeverNegativeAccounting": r'''TEST(StrategyKernel, EquityNeverNegativeAccounting) {
            auto cfg = zero_cost_cfg();
            cfg.trade.stop_loss = 2.0;
            cfg.trade.sizing = PositionSizing::RiskPercent;
            cfg.trade.risk_percent = 5.0;
            std::vector<OHLCV> bars = {
                mk(100, 100, 100, 100, 0),
                mk(100, 100, 97, 97.5, 1),
            };
            auto r = run_kernel(cfg, bars, {open_sig(0)});
            ASSERT_EQ(r.trades.size(), 1u);
            EXPECT_LT(r.trades[0].net_pnl, 0.0);
            EXPECT_DOUBLE_EQ(r.trades[0].net_pnl, -5000.0);
            EXPECT_DOUBLE_EQ(r.final_equity, 100000.0 + r.trades[0].net_pnl);
            EXPECT_NEAR(r.stats.net_profit, r.trades[0].net_pnl, 1e-9);
          }'''
          }

          for name, replacement in replacements.items():
              pattern = rf"TEST\(StrategyKernel, {name}\) \{{.*?\n\}}"
              s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"expected exactly one replacement for {name}, got {n}")

          p.write_text(s)

      - name: Validate modified tests
        run: |
          git diff --check
          grep -n "SignalQuantityDoesNotOverrideFixedLotSizing\|RiskSizingWithoutStopRejectsEntry\|DailyLossLimitCircuitBreakerClosesPositions\|EquityNeverNegativeAccounting" cpp_quant_engine/tests/test_strategy_kernel.cpp

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpp_quant_engine/tests/test_strategy_kernel.cpp .github/workflows/_remediate_cpp_tests.yml
          git commit -m "test(risk): align C++ expectations with enforced sizing boundary"
          git push origin audit/remediation-p0
