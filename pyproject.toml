[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos"
version = "1.0.0"
description = "Institutional-grade market research platform — deterministic, explainable, scientific"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "ResearchOS Scientific License"}
authors = [
    {name = "ResearchOS Team"},
]
keywords = [
    "market-research",
    "institutional-trading",
    "macro-research",
    "deterministic",
    "explainable-ai",
    "scientific-method",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    # ResearchOS has minimal external dependencies by design.
    # All computation is deterministic and uses only the Python standard library.
]


[project.optional-dependencies]
cli = [
    "click>=8.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/researchos/researchos"
Documentation = "docs/"

[tool.setuptools.packages.find]
where = ["."]
include = ["researchos*"]

[tool.pytest.ini_options]
testpaths = ["researchos/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"
